<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Tools Dashboard</title>
    <link rel="stylesheet" href="../team-checklist/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 350px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-family: var(--sans);
            letter-spacing: var(--letter-spacing);
        }
        p {
            color: var(--text-faint);
            font-size: 14px;
            margin-bottom: 30px;
            font-family: var(--mono);
            letter-spacing: var(--letter-spacing);
        }
        .app-button {
            display: block;
            width: 100%;
            background: var(--checked);
            color: var(--text-faint);
            border: none;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 500;
            font-family: var(--mono);
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 1px 4px; 
            letter-spacing: var(--letter-spacing);
        }
        .app-button:hover {
            background: var(--primary-color);
            color: var(--text-muted);
            transform: scale(1.05)
        }
    </style>
</head>
<body class="theme-vue">

    <div class="container">
        <h1>VUE Team Tools 🚀</h1>
        <p>Select a tool below to launch in app mode</p>

        <!-- Tool 1: Task Checklist -->
        <a href="checklist/index.html" class="app-button" target="_blank" onclick="window.open(this.href, 'TaskChecklist', 'width=500,height=700,top=100,left=100,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes'); return false;">
            📋 Task Checklist
        </a>

        <!-- FUTURE TOOLS CAN BE ADDED HERE EASILY:
        <a href="#" class="app-button" onclick="openApp('your-next-tool/')">
            ✨ Your Next Tool
        </a>
        -->
    </div>

    <script>
        function openApp(path) {
            // Gets the base URL and appends the tool path, opening it in a clean popup window
            const targetUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + path;
            window.open(targetUrl, '_blank', 'width=500,height=700,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes');
        }
    </script>

</body>
</html>
