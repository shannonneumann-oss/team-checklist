<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Tools Dashboard</title>
    <link rel="stylesheet" href="../team-checklist/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 350px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .app-button {
            display: block;
            width: 100%;
            background: #0078d4;
            color: white;
            border: none;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .app-button:hover {
            background: #106ebe;
        }
    </style>
</head>
<body class="theme-checklist">

    <div class="container">
        <h1>EPAM Team Tools 🚀</h1>
        <p>Select a tool below to launch in app mode</p>

        <!-- Tool 1: Task Checklist -->
        <a href="checklist/index.html" class="app-button" target="_blank" onclick="window.open(this.href, 'TaskChecklist', 'width=500,height=700,top=100,left=100,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes'); return false;">
            📋 Task Checklist
        </a>

        <!-- FUTURE TOOLS CAN BE ADDED HERE EASILY:
        <a href="#" class="app-button" onclick="openApp('your-next-tool/')">
            ✨ Your Next Tool
        </a>
        -->
    </div>

    <script>
        function openApp(path) {
            // Gets the base URL and appends the tool path, opening it in a clean popup window
            const targetUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, '/') + path;
            window.open(targetUrl, '_blank', 'width=500,height=700,toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes');
        }
    </script>

</body>
</html>
